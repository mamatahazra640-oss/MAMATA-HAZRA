name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Bundle Web Assets into Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Prepare Downloadable APK
        run: |
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-apk/SD-Trading-Learning-v1.0.apk
          else
            echo "Backup packaging..."
            zip -r release-apk/SD-Trading-Web-Package.zip dist/
          fi
          ls -la release-apk/

      - name: Upload SD-Trading APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SD-Trading-Learning-APK
          path: release-apk/*
          if-no-files-found: error
