<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Candlestick chart and trend graphics -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Candle 1 -->
    <line x1="170" y1="190" x2="170" y2="360" stroke-width="8" opacity="0.8" />
    <rect x="145" y="235" width="50" height="95" rx="8" fill="#ffffff" stroke="none" />
    
    <!-- Candle 2 -->
    <line x1="256" y1="140" x2="256" y2="320" stroke-width="8" opacity="0.8" />
    <rect x="231" y="170" width="50" height="110" rx="8" fill="#ffffff" stroke="none" />
    
    <!-- Candle 3 -->
    <line x1="342" y1="90" x2="342" y2="270" stroke-width="8" opacity="0.8" />
    <rect x="317" y="115" width="50" height="110" rx="8" fill="#ffffff" stroke="none" />
    
    <!-- Dynamic Upward Arrow line -->
    <path d="M120 370 Q 220 310, 310 180 L 390 100" stroke="#fcd34d" stroke-width="16" />
    <polyline points="340,95 395,95 395,150" stroke="#fcd34d" stroke-width="16" fill="none" />
  </g>
  
  <!-- SD Trading Text Badge -->
  <text x="256" y="445" text-anchor="middle" font-family="'Hind Siliguri', 'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="2">
    SD TRADING
  </text>
</svg>
